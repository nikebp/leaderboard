name: Build and Publish

on:
  push:
    branches: [main]
    paths-ignore:
      - 'k8s/**'

permissions:
  contents: write
  packages: write

jobs:
  build-push-bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag
        id: vars
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/nikebp/leaderboard:${{ steps.vars.outputs.tag }}
            ghcr.io/nikebp/leaderboard:main

      - name: Bump deployment manifest to new image tag
        run: |
          sed -i "s#image: ghcr.io/nikebp/leaderboard:.*#image: ghcr.io/nikebp/leaderboard:${{ steps.vars.outputs.tag }}#" k8s/deployment.yaml
          if git diff --quiet; then
            echo "No manifest change needed"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add k8s/deployment.yaml
            git commit -m "ci: deploy ${{ steps.vars.outputs.tag }}"
            git push
          fi
